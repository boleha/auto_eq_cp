[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "autoeq"
version = "4.1.2"
authors = [
  { name="Jaakko Pasanen", email="jaakko.o.pasanen@gmail.com" },
]
description = "Automatic headphone equalizer config generator"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    'Pillow>=10.0.1',
    'matplotlib>=3.7.3',
    # 锁定 scipy/numpy 版本：SLSQP 优化器在不同版本间收敛结果有差异，
    # 必须与本地开发环境一致，否则 Docker/GitHub Action 打包出来的结果不同
    'scipy==1.17.1',
    'numpy==2.4.6',
    'tabulate>=0.9.0',
    'soundfile>=0.12.1',
    'pyyaml>=6.0',
    'tqdm>=4.66.1',
    'uvicorn>=0.20.0',
    'fastapi>=0.100.0',
]

[project.urls]
"Homepage" = "https://github.com/jaakkopasanen/AutoEq"
"Bug Tracker" = "https://github.com/jaakkopasanen/AutoEq/issues"

[tool.hatch.build]
include = [
    "/autoeq",
    "LICENCE",
    "pyproject.toml",
]
exclude = [
    "/.github",
    "/targets",
    "/measurements",
    "/results",
    "/tests",
    ".gitignore",
    "/autoeq/README.md"
]
